          dbg+='\n\n===== '+fname+' (글자 인식) =====\n[품목 '+order.items.length+'건 / 센터: '+order.center+']\n'+order.items.map(it=>'· '+it.name+' | 총 '+it.total+' | 박스 '+it.box).join('\n');
          if(order.date&&!foundDate)foundDate=order.date;
          allOrders.push(order);
        }else{
          /* 글자 없음(이미지/스캔 PDF) → ① PDF 속 JPEG 직접 추출(빠르고 원본화질) ② 실패 시 렌더 */
          aiUsed=true;
          let pageB64s=[];
          try{pageB64s=await extractPdfJpegs(rawCopy);}catch(ee){pageB64s=[];}
          const useExtract=pageB64s.length>0;
          const pageCount=useExtract?pageB64s.length:pdf.numPages;
          for(let p=1;p<=pageCount;p++){
            setProgress('그림 PDF AI 인식 중... ('+(fi+1)+'/'+files.length+' · '+p+'/'+pageCount+'p)');
            try{
              const b64=useExtract?pageB64s[p-1]:await renderPdfPageToB64(pdf,p);
              let r=await recognizeShipImage(b64,'image/jpeg');
              if((!r.orders||!r.orders.length)&&useExtract){
                await new Promise(rs=>setTimeout(rs,2500));   /* 일시적 빈 응답 대비 재시도 */
                try{r=await recognizeShipImage(b64,'image/jpeg');}catch(re){}
              }
              if(r.orders&&r.orders.length){
                if(r.gdate&&!foundDate)foundDate=r.gdate;
                r.orders.forEach(o=>o.items.forEach(it=>{
                  /* recognizeShipImage에서 입수×박스수=총수량 교정 완료된 값 사용 */
                  aiRows.push({center:o.center,name:it.name,box:it.box||0,pack:it.pack||packOf(it.name),total:it.total||0,exp:it.exp||''});
                }));
                dbg+='\n\n===== '+fname+' '+p+'p (AI 인식) =====\n'+JSON.stringify(r.raw,null,1);
              }
            }catch(pe){dbg+='\n\n===== '+fname+' '+p+'p AI 오류: '+String(pe.message||pe);}
          }
        }
        if(aiRows.length+allOrders.length===rowsBefore){zeroFiles.push(fname);dbg+='\n\n===== '+fname+': 0행 (읽은 내용 없음)';}
      }catch(e){console.error('PDF 파싱 실패:',fname,e);dbg+='\n\n===== '+fname+' 처리 오류: '+String(e.message||e);if(zeroFiles.indexOf(fname)<0)zeroFiles.push(fname);}
    }
    setRawDbg(dbg);
    setLoading(false);setProgress('');

    /* 1) 글자 PDF는 즉시 반영 (텍스트 파서 = 정확) */
    if(allOrders.length>0)aggregate(allOrders,foundDate);

    /* 2) AI 인식분(그림 PDF)은 검토표로 → 사람이 박스수·입수·총수량 확인/수정 후 반영 */
    if(aiRows.length>0){
      if(zeroFiles.length)alert('⚠ 아래 파일에서는 한 행도 읽지 못했습니다. 해당 파일만 다시 올려주세요.\n\n· '+zeroFiles.join('\n· '));
      setReview({date:foundDate,rows:aiRows});
    }else if(aiUsed&&allOrders.length===0){
      alert('그림 PDF에서 표를 읽지 못했습니다. 더 선명한 파일로 다시 시도하거나, 🐞 인식 원문을 확인해 주세요.');
    }else if(allOrders.length===0){
      alert('발주 정보를 추출하지 못했습니다. PDF 형식을 확인하세요.');
    }
  };

  /* 검토표 → 출고계획 반영 */
  const applyReview=()=>{
    if(!review)return;
    const bad=review.rows.filter(r=>r.name&&r.box>0&&(!(r.total>0)));
    if(bad.length){alert('총수량이 비어있는 품목이 '+bad.length+'개 있습니다.\n박스입수를 입력하면 총수량이 자동 계산됩니다.\n(예: '+bad[0].name+')');return;}
    const byC={};
    review.rows.forEach(r=>{
      if(!r.name||!(r.box>0)||!(r.total>0))return;
      const center=normCenter2(r.center);
      if(!byC[center])byC[center]=[];
      byC[center].push({name:r.name,total:r.total,box:r.box,exp:r.exp||''});
    });
    const mts=review.src==='manual'?Date.now():0;
    const orders=Object.entries(byC).map(([center,items])=>({center,date:review.date,items,...(mts?{manual:mts}:{})}));
    if(!orders.length){alert('반영할 항목이 없습니다.');return;}
    /* 직접 추가에서 재고 품목을 골랐으면 그 이름 → 재고코드 연결 (재고 비교가 바로 되도록) */
    if(review.src==='manual'){
      const nm={...nameMap};let ch=0;
      review.rows.forEach(r=>{if(r.name&&r.code&&nm[normName(r.name)]!==r.code){const st=findStock(r.name);if(!st||st.code!==r.code){nm[normName(r.name)]=r.code;ch++;}}});
      if(ch){setNameMap(nm);saveNameMap(nm);}
    }
    /* 사람이 확인한 이름을 정식 사전에 등록 → 다음부터 같은 오인식 자동 교정 */
    try{saveCanon(review.rows.map(r=>r.name).filter(Boolean));}catch(e){}
    aggregate(orders,review.date);
    setReview(null);
  };
  /* 직접 추가: 품목명 검색 — 출고 품목명 + 본사재고/원재료(재고 수량 표시), 띄어쓰기로 여러 단어 검색 (2026-10-29) */
  const nameSuggest=(q)=>{
    const toks=String(q||'').trim().split(/\s+/).map(normName).filter(Boolean);
    if(!toks.length)return[];
    const hit=(s)=>{const n=normName(s);return toks.every(t=>n.includes(t));};
    const out=[],seen=new Set();
    Array.from(new Set([...(canonNames||[]),...Object.keys((parsed&&parsed.prodTotal)||{})])).forEach(n=>{
      if(!hit(n)||seen.has(n))return;seen.add(n);const st=findStock(n);
      out.push({name:n,code:'',stock:st?st.stock:null,unit:st?st.unit:'',src:'출고품목'});
    });
    linkCandidates().forEach(cd=>{
      if(!(hit(cd.name)||hit(cd.code))||seen.has(cd.name))return;seen.add(cd.name);
      out.push({name:cd.name,code:cd.code,stock:cd.stock,unit:cd.unit,src:cd.src});
    });
    return out.slice(0,40);
  };
  const pickName=(i,s)=>{
    updReviewRow(i,'name',s.name);
    setReview(rv=>{if(!rv)return rv;const rows=rv.rows.slice();rows[i]={...rows[i],code:s.code||''};return{...rv,rows};});
    setNameSug(null);
  };
  const updReviewRow=(i,key,val)=>{
    setReview(rv=>{
      if(!rv)return rv;
      const rows=rv.rows.slice();
      const r={...rows[i]};
      if(key==='center'||key==='name'){r[key]=val;if(key==='name'&&!(r.pack>0)){const pk=packOf(val);if(pk>0){r.pack=pk;if(r.box>0)r.total=r.box*pk;}}rows[i]=r;return{...rv,rows};}
      const n=Math.max(0,parseInt(String(val).replace(/[^\d]/g,''))||0);
      r[key]=n;
      if(key==='box'||key==='pack')r.total=(r.pack>0&&r.box>0)?r.box*r.pack:r.total;
      rows[i]=r;return{...rv,rows};
    });
  };
  /* ✍️ 직접 추가 (2026-10-29) — 발주서 없이 센터·품목·박스를 손으로 넣어 출고계획에 합침 */
  const blankRow=(center)=>({center:center||'김포(켄달)',name:'',box:0,pack:0,total:0,exp:''});
  const openManual=(date,center)=>{
    let d=date||shipDate||'';
    if(!d){const t=new Date(Date.now()+9*3600e3+86400e3);d=t.toISOString().slice(0,10);}
    setReview({date:d,rows:[blankRow(center)],src:'manual'});
  };
  const addReviewRow=()=>setReview(rv=>rv?{...rv,rows:[...rv.rows,blankRow(rv.rows.length?normCenter2(rv.rows[rv.rows.length-1].center):'')]}:rv);
  const delReviewRow=(i)=>setReview(rv=>rv?{...rv,rows:rv.rows.filter((_,j)=>j!==i)}:rv);

  /* 제품 총수량 재계산 (센터별 items 합산) */
  const recomputeProdTotal=(byCenter)=>{
    const pt={};
    Object.values(byCenter).forEach(d=>Object.entries(d.items).forEach(([name,v])=>{pt[name]=(pt[name]||0)+v.total;}));
    return pt;
  };
  /* 날짜+센터 복합키 (입고예정일이 다르면 별도 그룹으로 분리) */
  /* \u2500\u2500 AJ\uB124\uD2B8\uC6CD\uC2A4 \uD30C\uB81B\uD2B8 \uC804\uD45C \uC124\uC815 \u2500\u2500
     \uD30C\uB81B\uD2B8 = 30\uBC15\uC2A4 \uAE30\uC900, \uC794\uC5EC\uAC00 6\uBC15\uC2A4 \uC774\uC0C1\uC77C \uB54C\uB9CC 1\uD30C\uB81B\uD2B8 \uCD94\uAC00
     (125\uBC15\uC2A4 \u2192 4\uD30C\uB81B\uD2B8 / 126\uBC15\uC2A4 \u2192 5\uD30C\uB81B\uD2B8) */
  const AJ_VENDOR='(\uC8FC)\uCEEC\uB9AC/\uB9C8\uCF13\uCEEC\uB9AC';
  const AJ_WARE={
    '\uAE40\uD3EC(\uCF04\uB2EC)':{ware:'\uB9C8\uCF13\uCEEC\uB9AC_\uAE40\uD3EC\uB0C9\uB3D9'},
    '\uAE40\uD3EC(\uC0BC\uC6B0)':{ware:'\uB9C8\uCF13\uCEEC\uB9AC_\uAE40\uD3EC\uB0C9\uB3D9'},
    '\uD3C9\uD0DD\uCEEC\uB9AC':{ware:'\uB9C8\uCF13\uCEEC\uB9AC_\uD3C9\uD0DD\uB0C9\uB3D9(4\uCE35)'},
    '\uCC3D\uC6D0\uBB3C\uB958\uB300\uD589':{ware:'\uB9C8\uCF13\uCEEC\uB9AC_\uC785\uACE0\uB300\uD589\uC13C\uD130 \uB0C9\uB3D9'}
  };
  const palletOf=(box)=>Math.floor((+box||0)/30)+(((+box||0)%30)>=6?1:0);

  const DSEP='\u241F';
  const dowLabel=(ds)=>{const d=new Date(String(ds||'')+'T00:00:00');return isNaN(d.getTime())?'':' ('+['일','월','화','수','목','금','토'][d.getDay()]+')';};
  const ckey=(date,center)=>(date||'미정')+DSEP+center;
  const parseCkey=(k)=>{const i=k.indexOf(DSEP);return i<0?{date:'미정',center:k}:{date:k.slice(0,i),center:k.slice(i+DSEP.length)};};
  /* 구버전 저장데이터(센터만 키) → 복합키로 마이그레이션 */
  const migrateByCenter=(byCenter,fallbackDate)=>{
    if(!byCenter)return byCenter;
    const keys=Object.keys(byCenter);
    if(keys.every(k=>k.indexOf(DSEP)>=0))return byCenter; /* 이미 복합키 */
    const out={};
    keys.forEach(k=>{
      if(k.indexOf(DSEP)>=0){out[k]=byCenter[k];return;}
      /* 센터 내 품목의 exp(입고예정일)를 우선 사용, 없으면 fallback */
      const items=byCenter[k].items||{};
      let d=fallbackDate||'';
      for(const nm in items){if(items[nm]&&items[nm].exp){d=items[nm].exp;break;}}
      out[ckey(d,k)]=byCenter[k];
    });
    return out;
  };
  /* 파일(발주) 내용 시그니처 - 같은 내용이면 중복으로 판단 */
  const orderSig=(o)=>{
    const items=(o.items||[]).map(it=>it.name+':'+it.box+':'+it.total).sort().join('|');
    return (o.center||'')+'#'+(o.date||'')+'#'+items+(o.manual?'#m'+o.manual:'');
  };
  /* 특정 (날짜·센터) 빼기 - 그 시그니처도 제거 → 다시 올릴 수 있음 */
  const removeCenter=(k)=>{
    if(!parsed||!parsed.byCenter)return;
    const{date,center}=parseCkey(k);
    if(!confirm('"'+center+'" ('+(date||'미정')+') 을(를) 출고계획에서 뺄까요?'))return;
    const byCenter={...parsed.byCenter};
    delete byCenter[k];
    const pref=center+'#'+(date||'')+'#';
    const sources=(Array.isArray(parsed.sources)?parsed.sources:[]).filter(s=>!s.startsWith(pref));
    const result={byCenter,prodTotal:recomputeProdTotal(byCenter),sources};
    setParsed(result);saveShipsort(result,shipDate);
  };

  /* 이 날짜의 출고계획 전체 빼기 (2026-10-29) — 그 날짜의 모든 센터를 한 번에 제거 */
  const removeDay=(day)=>{
    if(!parsed||!parsed.byCenter)return;
    const norm=d=>(d&&d!=='미정')?d:'미정';
    const keys=Object.keys(parsed.byCenter).filter(k=>norm(parseCkey(k).date)===norm(day));
    if(!keys.length)return;
    const names=keys.map(k=>parseCkey(k).center);
    if(!confirm((norm(day)==='미정'?'날짜 미정':day)+' 출고계획 전체('+keys.length+'개 센터: '+names.join(', ')+')를 뺄까요?'))return;
    const byCenter={...parsed.byCenter};
    keys.forEach(k=>{delete byCenter[k];});
    const prefs=keys.map(k=>{const c=parseCkey(k);return c.center+'#'+(c.date||'')+'#';});
    const sources=(Array.isArray(parsed.sources)?parsed.sources:[]).filter(s=>!prefs.some(pf=>s.startsWith(pf)));
    const result={byCenter,prodTotal:recomputeProdTotal(byCenter),sources};
    setParsed(result);saveShipsort(result,shipDate);
  };

  /* 특정 (날짜·센터)의 출고일자 변경 — 미정→날짜 지정, 날짜 이동, 빈 값이면 미정으로 */
  /* 출고일자 수정 — 자체 모달 사용. 예전 prompt()/confirm() 방식은 아이폰 홈화면 앱(PWA)에서
     창이 조용히 무시되어 '미정' 날짜 지정이 안 되던 문제 (2026-10-15) */
  const[dateEdit,setDateEdit]=useState(null);  /* {k,center,cur,val,mergeTo} */
  const moveCenterDate=(k)=>{
    if(!parsed||!parsed.byCenter||!parsed.byCenter[k])return;
    const{date,center}=parseCkey(k);
    const cur=(date&&date!=='미정')?date:'';
    setDateEdit({k,center,cur,val:cur||today2(),mergeTo:null});
  };
  const applyCenterDate=(ndRaw,force)=>{
    const de=dateEdit;if(!de||!parsed||!parsed.byCenter||!parsed.byCenter[de.k])return setDateEdit(null);
    let nd=String(ndRaw==null?de.val:ndRaw).trim().replace(/[.\/]/g,'-');
    if(nd&&!/^\d{4}-\d{2}-\d{2}$/.test(nd)){alert('날짜 형식이 올바르지 않습니다. 예: 2026-09-20');return;}
    const k=de.k,center=de.center;
    const newK=ckey(nd,center);
    if(newK===k){setDateEdit(null);return;}
    if(parsed.byCenter[newK]&&!force){setDateEdit({...de,val:nd,mergeTo:nd||'미정'});return;}
    doMoveCenter(k,nd,center);
    setDateEdit(null);
  };
  const doMoveCenter=(k,nd,center)=>{
    const{date}=parseCkey(k);
    const newK=ckey(nd,center);
    const byCenter={...parsed.byCenter};
    const src=byCenter[k];
    if(byCenter[newK]){
      const dst={...byCenter[newK],items:{...(byCenter[newK].items||{})}};
      Object.entries(src.items||{}).forEach(([n,v])=>{
        const ex=dst.items[n];
        dst.items[n]=ex?{...ex,box:(+ex.box||0)+(+v.box||0),total:(+ex.total||0)+(+v.total||0)}:v;
      });
      dst.totalBox=(+dst.totalBox||0)+(+src.totalBox||0);
      byCenter[newK]=dst;
    }else byCenter[newK]=src;
    delete byCenter[k];
    /* 중복 방지 시그니처의 날짜도 함께 이동 (같은 발주 파일 재업로드 시 중복 판정 유지) */
    const oldDates=(date==='미정'||!date)?['','미정']:[date];
    const sources=(Array.isArray(parsed.sources)?parsed.sources:[]).map(s=>{
      for(const od of oldDates){
        const pref=center+'#'+od+'#';
        if(s.startsWith(pref))return center+'#'+nd+'#'+s.slice(pref.length);
      }
      return s;
    });
    const result={byCenter,prodTotal:recomputeProdTotal(byCenter),sources};
    setParsed(result);saveShipsort(result,shipDate);
  };

  /* 센터별 집계 - 기존 데이터에 누적, 중복 파일은 자동 제외 */
  /* ── 이카운트 '판매 전표' 업로드용 엑셀 만들기 ──
     API 검증 전까지 사용하는 방식: 파일을 만들어 이카운트 [엑셀 자료 올리기]에 올리면 전표가 등록된다.
     센터명 → 이카운트 거래처명 매핑은 화면에서 확인·수정할 수 있게 미리보기를 먼저 띄운다. */
  const ECOUNT_CUST={
    '김포(삼우)':'주식회사 컬리',
    '김포(켄달)':'주식회사 컬리',
    '평택컬리':'주식회사 컬리',
    '창원물류대행':'주식회사 컬리'
  };
  const[xlPrev,setXlPrev]=useState(null);   /* 이카운트 전표 미리보기 */
  const buildEcountRows=()=>{
    const out=[];
    if(!parsed||!parsed.byCenter)return out;
    Object.entries(parsed.byCenter).forEach(([k,d])=>{
      const{date,center}=parseCkey(k);
      const cust=ECOUNT_CUST[center]||center;
      Object.entries(d.items||{}).forEach(([name,v])=>{
        const st=findStock(name);
        out.push({
          date:(date||shipDate||today2()).replace(/-/g,''),
          cust:cust, center:center,
          prodCd:(st&&st.code)||'', prodName:name,
          qty:+v.total||0, box:+v.box||0, exp:v.exp||'',
          price:0
        });
      });
    });
    out.sort((a,b)=>(a.date+a.cust+a.prodName).localeCompare(b.date+b.cust+b.prodName,'ko'));
    return out;
  };
  const downloadEcountXl=(rows)=>{
    if(typeof XLSX==='undefined'){alert('엑셀 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');return;}
    /* 이카운트 판매입력 엑셀 업로드 표준 열 구성 */
    const head=['일자','순번','거래처명','품목코드','품목명','수량','단가','공급가액','부가세','적요'];
    const body=rows.map((r,i)=>[
      r.date, i+1, r.cust, r.prodCd, r.prodName, r.qty, r.price||'', '', '',
      (r.center||'')+(r.exp?(' / 소비기한 '+r.exp):'')
    ]);
    const ws=XLSX.utils.aoa_to_sheet([head,...body]);
    ws['!cols']=[{wch:10},{wch:6},{wch:18},{wch:12},{wch:34},{wch:9},{wch:10},{wch:12},{wch:10},{wch:26}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'판매입력');
    XLSX.writeFile(wb,'이카운트_판매전표_'+(shipDate||today2())+'.xlsx');
  };

  /* ── 컬리 발주 확인 ──
     PC 수집기가 컬리 포털에서 읽어 서버에 저장해둔 발주를 불러온다.
     서버에 저장돼 있으므로 휴대폰에서도 그대로 보인다. */
  const[kurly,setKurly]=useState(null);      /* {at,dates,rows} */
  const[kurlyOpen,setKurlyOpen]=useState(false);
  const[kurlyDate,setKurlyDate]=useState('');
  const[kurlyBusy,setKurlyBusy]=useState('');
  const loadKurly=async()=>{
    try{
      const{data}=await sbClient.from('app_state').select('v:state_data->kurly_orders').eq('id',1).maybeSingle();
      const v=data&&data.v;
      if(v&&Array.isArray(v.rows)){
        /* 방금 수집기에서 직접 읽어온 더 새로운 데이터가 있으면 오래된 서버 저장본으로 덮지 않는다
           (주기 동기화가 저장본을 다시 읽으며 화면이 '발주 없음'으로 뒤집히던 문제) */
        setKurly(p=>(p&&p.at&&(!v.at||p.at>=v.at))?p:v);

  /* ── 서명완료 거래명세서 받기: 각 명세서 [상세] → [서명완료 거래명세서 (PDF)]를 PC의
        문서\컬리 서명완료 거래명세서 폴더에 '날짜_센터_코드.pdf'로 저장.
        서명은 컬리 입고 때 되므로 입고 전 명세서는 '서명 전'으로 남는다.
        date 없이 부르면 입고일이 지난 것 중 안 받은 것만 모두 받는다. ── */
  const[sgnBusy,setSgnBusy]=useState('');
  const[sgnRes,setSgnRes]=useState(null);
  /* 받을 입고일 — 기본은 마지막으로 거래명세서를 생성한 입고예정일, 비우면 밀린 것 전부 */
  const[sgnDate,setSgnDate]=useState(()=>{try{return localStorage.getItem('bnf_kurly_signed_date')||'';}catch(e){return '';}});
  const pickSgnDate=(d)=>{setSgnDate(d);try{localStorage.setItem('bnf_kurly_signed_date',d);}catch(e){}};
  const signedFetch=async(date)=>{
    setSgnRes(null);setSgnBusy('📄 서명완료 명세서 받는 중...');
    try{
      const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),600000);
      const r=await fetch(BRIDGE+'/statements/signed'+(date?'?date='+date:''),{signal:ctl.signal});clearTimeout(tm);
      const j=await r.json();
      setSgnBusy('');
      if(j&&j.error==='LOGIN_REQUIRED'){setSgnRes({err:'컬리 로그인이 필요합니다 — 사무실 PC 전용 크롬에서 로그인 후 다시 눌러주세요'});return;}
      if(j&&j.error){setSgnRes({err:'실패: '+j.error});return;}
      if(j&&Array.isArray(j.saved))setSgnRes(j);
      else setSgnRes({err:'결과를 확인하지 못했습니다'});
    }catch(e){setSgnBusy('');setSgnRes({err:'사무실 PC 수집기에 연결하지 못했습니다 (PC에서만 사용 가능)'});}
  };

  const aggregate=(orders,dateStr)=>{
    const hasExisting=parsed&&parsed.byCenter;
    const prevSources=(hasExisting&&Array.isArray(parsed.sources))?parsed.sources:[];
    const seen=new Set(prevSources);
    const fresh=[],dupOrders=[];let dup=0;
    orders.forEach(o=>{
      const sig=orderSig(o);
      if(seen.has(sig)){dup++;dupOrders.push(o);return;}
      seen.add(sig);fresh.push({o,sig});
    });
    const byCenter=hasExisting?JSON.parse(JSON.stringify(parsed.byCenter)):{};
    /* 중복 파일이어도 비어 있는 칸(소비기한)은 채움 (2026-10-29) — 같은 날짜·센터 우선, 없으면 같은 센터의 같은 품목 */
    let filled=0;
    dupOrders.forEach(o=>(o.items||[]).forEach(it0=>{
      if(!it0.exp)return;const nm=fixAiName(it0.name);
      const cand=[ckey(o.date,o.center),...Object.keys(byCenter).filter(k=>parseCkey(k).center===o.center)];
      for(const k of cand){const it=byCenter[k]&&byCenter[k].items&&byCenter[k].items[nm];if(it&&!it.exp){it.exp=it0.exp;filled++;break;}}
    }));
    if(fresh.length===0){
      if(filled>0){
        const result={byCenter,prodTotal:recomputeProdTotal(byCenter),sources:prevSources};
        setParsed(result);saveShipsort(result,shipDate);recordPlanExps(dupOrders);
        alert('이미 추가된 파일이라 수량은 그대로 두고, 비어 있던 소비기한 '+filled+'건을 채웠습니다.');
      }else alert('이미 추가된 파일입니다 (중복 '+dup+'건 건너뜀). 데이터는 그대로 유지됩니다.');
      return;
    }
    fresh.forEach(({o})=>{
      const K=ckey(o.date,o.center);
      if(!byCenter[K])byCenter[K]={items:{},totalBox:0};
      o.items.forEach(it0=>{
        /* 어떤 경로로 들어와도 품목명 교정(브랜드 뒤섞임·오인식) 후 집계 */
        const it=Object.assign({},it0,{name:fixAiName(it0.name)});
        if(!byCenter[K].items[it.name]){
          byCenter[K].items[it.name]={box:0,total:0,exp:it.exp};
        }
        byCenter[K].items[it.name].box+=it.box;
        byCenter[K].items[it.name].total+=it.total;
        if(it.exp)byCenter[K].items[it.name].exp=it.exp;
        byCenter[K].totalBox+=it.box;
      });
    });
    const prodTotal=recomputeProdTotal(byCenter);
    const sources=[...prevSources,...fresh.map(f=>f.sig)];
    const newDate=(hasExisting&&shipDate)?shipDate:(dateStr||shipDate);
    const result={byCenter,prodTotal,sources};
    setParsed(result);
    setShipDate(newDate);
    saveShipsort(result,newDate); /* 새로고침해도 남도록 저장 */
    recordPlanExps(fresh.map(f=>f.o)); /* 들어온 소비기한을 직전 기록에 자동 저장 */
    if(dup>0)alert(fresh.length+'건 추가됨 · 중복 '+dup+'건은 자동 제외했습니다.'+(filled?' (중복 파일에서 비어 있던 소비기한 '+filled+'건 채움)':''));
  };

  const exportResult=()=>{
    if(!parsed)return;
    /* 날짜별 그룹핑 */
    const groups={};
    Object.entries(parsed.byCenter).forEach(([k,d])=>{const{date,center}=parseCkey(k);(groups[date]=groups[date]||[]).push({center,d});});
    const dates=Object.keys(groups).sort();
    const rows=[];
    dates.forEach(date=>{
      rows.push([(date||'미정')+' 출고 예정 상품','','','','']);
      rows.push(['출고센터','제품명','박스수량','제품수량','소비기한']);
      const pt={};
      groups[date].sort((a,b)=>a.center.localeCompare(b.center,'ko')).forEach(({center,d})=>{
        const its=Object.entries(d.items);
        its.forEach(([name,v],i)=>{rows.push([i===0?center:'',name,v.box,v.total,effExp(name,v.exp).exp]);pt[name]=(pt[name]||0)+v.total;});
        rows.push(['','합계',d.totalBox,'','']);
        rows.push(['','박스',30,'','']);
        rows.push(['','팔레트 수',(d.totalBox/30).toFixed(6),'','']);
        rows.push(['','','','','']);
      });
      rows.push(['[제품 총수량]','','','','']);
      Object.entries(pt).forEach(([name,t])=>rows.push([name,t,'ea','','']));
      rows.push(['','','','','']);
      rows.push(['','','','','']);
    });
    exportXL(rows,'출고계획_'+(dates[0]||new Date().toISOString().slice(0,10)),'출고계획');
  };

  const onDrop=(e)=>{e.preventDefault();filesFromDrop(e.dataTransfer).then(fs=>{if(fs.length)handleFiles(fs);});};

  /* 카톡 등에서 "보내기(공유)"로 전달된 PDF 자동 처리 (독립 실행형 앱 전용) */
  useEffect(()=>{
    const onShared=(e)=>{const fs=e&&e.detail;if(fs&&fs.length)handleFiles(fs);};
    window.addEventListener('bnf-shared-files',onShared);
    if(window.__bnfSharedFiles&&window.__bnfSharedFiles.length){
      const fs=window.__bnfSharedFiles;window.__bnfSharedFiles=null;
      setTimeout(()=>handleFiles(fs),0);
    }
    return()=>window.removeEventListener('bnf-shared-files',onShared);
  },[]);

  return R('div',{className:'pg fa'},
    R('div',{className:'pg-hdr'},
      R('div',null,R('div',{className:'pg-title'},'📦 출고 계획'),R('div',{style:{fontSize:11,color:'var(--tm)',marginTop:2}},'거래명세서 PDF · 발주서 표/이미지 → 센터별 자동 정리',
        saveMsg==='saving'&&R('span',{style:{marginLeft:8,color:'#F59E0B',fontWeight:700}},'· 저장 중…'),
        saveMsg==='saved'&&R('span',{style:{marginLeft:8,color:'var(--ok)',fontWeight:700}},'· 저장됨 ✓'),
        saveMsg==='error'&&R('span',{style:{marginLeft:8,color:'#EF4444',fontWeight:700}},'· 저장 실패 ⚠')
      )),
      R('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
        parsed&&R('button',{className:'btn bp',onClick:exportResult},'엑셀'),
        parsed&&R('button',{className:'btn bs',onClick:saveImage},'🖼 이미지 저장'),
        parsed&&R('button',{className:'btn bs',onClick:copyImage},'📋 이미지 복사'),
        parsed&&R('button',{className:'btn bs',onClick:async()=>{
          if(!confirm('저장된 출고 계획을 지울까요?\n(지우기 전에 지난 출고 기록으로 자동 보관됩니다)'))return;
          await archiveShip(parsed,shipDate);   /* 초기화 전에 보관 — 기록이 사라지지 않게 (2026-10-22) */
          setParsed(null);setShipDate('');saveShipsort(null,'');
        }},'초기화'),
        R('button',{className:'btn bs',onClick:()=>{setArcOpen(v=>!v);if(!arcList)loadArchives();}},'📜 지난 출고')
      )
    ),
    /* 지난 출고 기록 목록 — 초기화할 때마다 자동 보관된 스냅샷 */
    arcOpen&&R('div',{className:'card',style:{marginBottom:12,padding:'12px 14px'}},
      R('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        R('div',{style:{fontSize:13,fontWeight:800}},'📜 지난 출고 기록'),
        R('span',{style:{fontSize:10.5,color:'var(--tm)'}},'초기화할 때마다 자동 보관 · 누르면 그 계획을 다시 불러옵니다 (지금 계획도 먼저 보관됨)'),
        R('div',{style:{flex:1}}),
        R('button',{className:'btn bs btn-sm',onClick:loadArchives},'↻'),
        R('button',{className:'btn bw btn-sm',onClick:()=>setArcOpen(false)},'✕')),
      arcList===null?R('div',{style:{fontSize:12,color:'var(--tm)'}},'불러오는 중...'):
      arcList.length===0?R('div',{style:{fontSize:12,color:'var(--tm)'}},'아직 보관된 기록이 없습니다 — 다음 초기화부터 자동으로 쌓입니다.'):
      R('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
        ...arcList.map(fn=>{
          const lb=fn.replace(/_[a-z0-9]+\.json$/,'');
          return R('button',{key:fn,className:'btn bw btn-sm',onClick:()=>openArchiveFile(fn),title:fn},'📦 '+lb);
        }))),
    /* 컬리 발주 확인 — 페이지에 들어오면 자동으로 (필요 시 자동 로그인 포함) 조회된 결과 요약 */
    R('div',{className:'card',style:{marginBottom:12,padding:'12px 14px'}},
      R('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}},
        R('div',null,
          R('div',{style:{fontSize:13,fontWeight:800}},'🛒 컬리 발주 확인'),
          (()=>{
            const t=today2();
            const up=((kurly&&kurly.rows)||[]).filter(r=>r.date&&r.date>=t);
            if(up.length){
              const byD={};up.forEach(r=>{(byD[r.date]=byD[r.date]||[]).push(r);});
              const parts=Object.keys(byD).sort().map(d=>{
                const rows=byD[d];
                const box=rows.reduce((a,r)=>a+(+r.box||0),0);
                const lack=rows.filter(r=>{const st=findStock(fixAiName(r.name));return st&&(st.matchedName||st.code)&&(+st.stock||0)<(+r.total||0);}).length;
                return d.slice(5).replace('-','/')+dowLabel(d)+' '+box+'박스'+(lack?('·부족'+lack):'·✓가능');
              });
              return R('div',{style:{fontSize:11,fontWeight:700,color:'#15803D',marginTop:2}},'📢 다가오는 발주: '+parts.join('  |  '));
            }
            if(kurlyUp===null)return R('div',{style:{fontSize:10.5,color:'var(--p)',fontWeight:700,marginTop:2}},'📡 컬리 발주 자동 확인 중... '+(kurlyBusy||''));
            if(kurlyErr==='login'||kurlyErr==='login-sent')return R('div',{style:{fontSize:10.5,color:'#B91C1C',fontWeight:700,marginTop:2}},'🔐 컬리 로그인 필요 — [컬리 발주 확인]을 눌러 로그인 창을 띄워주세요');
            if(kurlyErr==='offline')return R('div',{style:{fontSize:10.5,color:'#92400E',marginTop:2}},'⚠ 사무실 PC 수집기 연결 안 됨 — 마지막 수집 '+(kurly&&kurly.at?new Date(kurly.at).toLocaleString('ko-KR'):'없음'));
            return R('div',{style:{fontSize:10.5,color:'var(--tm)',marginTop:2}},'다가오는 컬리 발주 없음'+(kurly&&kurly.at?(' · 마지막 수집 '+new Date(kurly.at).toLocaleString('ko-KR')):''));
          })()
        ),
        R('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
          R('button',{className:'btn bw btn-sm',disabled:!!stmtBusy,onClick:stmtPrint,
            title:'포털 거래명세서 내역에서 최근 입고예정일 PDF를 받아 사무실 프린터로 인쇄 — 짝수 페이지만, 창원 3부·그 외 1부'},stmtBusy||'🖨 거래명세서 출력'),
          R('span',{style:{display:'inline-flex',gap:4,alignItems:'center'}},
            R('input',{type:'date',value:sgnDate,onChange:e=>pickSgnDate(e.target.value),disabled:!!sgnBusy,
              title:'받을 입고일 — 비우면 입고가 끝난 것 중 안 받은 것 전부',
              style:{fontSize:12,padding:'3px 6px',border:'1px solid var(--bd)',borderRadius:7,height:30}}),
            R('button',{className:'btn bw btn-sm',disabled:!!sgnBusy,onClick:()=>signedFetch(sgnDate||undefined),
              title:'선택한 입고일(비우면 밀린 것 전부)의 서명완료 PDF를 사무실 PC 문서\\컬리 서명완료 거래명세서 폴더에 받습니다 (이미 받은 건 건너뜀)'},sgnBusy||'📄 서명완료 거래명세서 받기')),
          R('button',{className:'btn bw btn-sm',onClick:()=>{loadKurly();setKurlyOpen(true);loadUpcoming();}},'🛒 컬리 발주 확인'),
          R('button',{className:'btn bp btn-sm',onClick:()=>cfmPrepare(),disabled:!!cfmBusy,
            title:'다가오는 발주일을 자동으로 찾아 확정을 준비합니다'},cfmBusy||'✅ 컬리 발주 확정')
        )
      ),
      stmtRes&&R('div',{style:{marginTop:8,padding:'8px 12px',borderRadius:9,fontSize:12,fontWeight:700,
          background:stmtRes.err?'#FEF2F2':'#F0FDF4',border:'1px solid '+(stmtRes.err?'#FECACA':'#BBF7D0'),
          color:stmtRes.err?'#B91C1C':'#15803D',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        stmtRes.err?('⚠ '+stmtRes.err)
          :R('div',{style:{lineHeight:1.6}},
            R('div',null,'🖨 '+(stmtRes.date||'')+' 거래명세서 인쇄 '+
              ((stmtRes.printed||[])[0]&&stmtRes.printed[0].printer?'('+stmtRes.printed[0].printer+') ':'')+'— '+
              (stmtRes.printed||[]).map(x=>String(x.center||x.code).split(' ')[0]+' '+x.copies+'부'+(x.printError?'(인쇄실패: '+x.printError+')':'')).join(' · ')+
              ' (짝수 페이지만)'),
            (stmtRes.printed||[]).map(x=>R('div',{key:x.code,style:{fontWeight:500,color:x.saveError?'#B91C1C':'#166534'}},
              x.saved?'💾 '+x.saved:'⚠ 파일 저장 실패 '+x.code+(x.saveError?' — '+x.saveError:''))),
            stmtRes.dir&&R('div',{style:{fontWeight:500,color:'var(--tm)',fontSize:11}},'저장 위치(사무실 PC): '+stmtRes.dir)),
        R('button',{className:'btn bw btn-sm',style:{marginLeft:'auto'},onClick:()=>setStmtRes(null)},'✕')),
      sgnRes&&R('div',{style:{marginTop:8,padding:'8px 12px',borderRadius:9,fontSize:12,fontWeight:700,
          background:sgnRes.err?'#FEF2F2':'#F0FDF4',border:'1px solid '+(sgnRes.err?'#FECACA':'#BBF7D0'),
          color:sgnRes.err?'#B91C1C':'#15803D',display:'flex',alignItems:'flex-start',gap:8,flexWrap:'wrap'}},
        sgnRes.err?('⚠ '+sgnRes.err)
          :R('div',{style:{lineHeight:1.6}},
            R('div',null,'📄 서명완료 거래명세서'+(sgnRes.date?' ('+sgnRes.date+' 입고)':'')+' — 새로 받음 '+sgnRes.saved.length+'건'+
              ((sgnRes.already||[]).length?' · 이미 받음 '+sgnRes.already.length+'건':'')),
            sgnRes.saved.map(x=>R('div',{key:x.code,style:{fontWeight:500,color:'#166534'}},'· '+x.file)),
            (sgnRes.pending||[]).length>0&&R('div',{style:{color:'#92400E'}},
              '⏳ 아직 서명 전 '+sgnRes.pending.length+'건 ('+sgnRes.pending.map(x=>x.center).join('·')+') — 컬리 입고 후 [📄 서명완료 명세서 받기]를 다시 누르세요'),
            (sgnRes.failed||[]).length>0&&R('div',{style:{color:'#B91C1C'}},
              '⚠ 실패 '+sgnRes.failed.length+'건: '+sgnRes.failed.map(x=>x.code+' '+(x.msg||'')).join(' / ')),
            R('div',{style:{fontWeight:500,color:'var(--tm)',fontSize:11}},'저장 위치(사무실 PC): '+(sgnRes.dir||''))),
        R('button',{className:'btn bw btn-sm',style:{marginLeft:'auto'},onClick:()=>setSgnRes(null)},'✕')),
      /* ── 발주 내용 대시보드: 날짜별 → 센터별 → 품목·재고 상태를 카드에서 바로 ── */
      (()=>{
        const t=today2();
        const up=((kurly&&kurly.rows)||[]).filter(r=>r.date&&r.date>=t);
        if(!up.length)return null;
        const byD={};up.forEach(r=>{(byD[r.date]=byD[r.date]||[]).push(r);});
        const stBadge=(r)=>{
          const st=findStock(fixAiName(r.name));
          if(!st||!(st.matchedName||st.code))return R('span',{style:{fontSize:9,color:'#C9BFB7',marginLeft:4,flexShrink:0}},'연결없음');
          const enough=(+st.stock||0)>=(+r.total||0);
          return R('span',{style:{display:'inline-flex',alignItems:'center',gap:3,marginLeft:4,flexShrink:0}},
            R('span',{style:{fontSize:9.5,color:'#9A9088',whiteSpace:'nowrap'}},'재고 '+fN(+st.stock||0)),
            R('span',{style:{fontSize:9,fontWeight:800,padding:'0 5px',borderRadius:8,whiteSpace:'nowrap',
              background:enough?'#DCFCE7':'#FEE2E2',color:enough?'#15803D':'#B91C1C'}},
              enough?'✓':'-'+fN((+r.total||0)-(+st.stock||0))));
        };
        return R('div',{style:{marginTop:10,display:'flex',flexDirection:'column',gap:10}},
          ...Object.keys(byD).sort().map(d=>{
            const rows=byD[d];
            const byC={};rows.forEach(r=>{const c=normCenter2(r.center);(byC[c]=byC[c]||[]).push(r);});
            const box=rows.reduce((a,r)=>a+(+r.box||0),0),tot=rows.reduce((a,r)=>a+(+r.total||0),0);
            const lack=rows.filter(r=>{const st=findStock(fixAiName(r.name));return st&&(st.matchedName||st.code)&&(+st.stock||0)<(+r.total||0);}).length;
            return R('div',{key:d,style:{border:'1.5px solid #FED7AA',borderRadius:12,background:'#FFFDF9',overflow:'hidden'}},
              R('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',background:'#FFF7ED',padding:'7px 11px'}},
                R('span',{style:{fontSize:13,fontWeight:800,color:'var(--p)'}},'📦 '+d.slice(5).replace('-','/')+dowLabel(d)+' 입고'),
                R('span',{style:{fontSize:11,fontWeight:700,color:'var(--tm)'}},box+'박스 · '+fN(tot)+'개 · 팔레트 '+(box/30).toFixed(2)),
                lack>0?R('span',{style:{fontSize:10,fontWeight:800,color:'#B91C1C',background:'#FEE2E2',borderRadius:999,padding:'1px 8px'}},'⚠ 재고 부족 '+lack)

                      )

                  R('button',{className:'no-capture',onClick:()=>{setLinkSearch(String(name).replace(/\[[^\]]*\]/g,'').trim());setLinkTarget(name);},
                    style:{border:'1px solid #E9E2DC',background:st?'#fff':'#FFF7ED',color:st?'#9A9088':'var(--p)',borderRadius:8,padding:'2px 8px',fontSize:10,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'},

                );
              })

      })(),
      R('div',{style:{fontSize:10,color:'var(--tm)',marginTop:8,padding:'0 4px'}},'※ 입고예정일이 다르면 자동으로 날짜별 섹션으로 나뉩니다. 팔레트는 30박스=1팔레트 기준입니다. "재고정보없음"이면 [🔗 연결]로 본사재고 항목을 직접 지정하세요(다음부터 자동 적용).')

    linkTarget&&R('div',{onClick:e=>{if(e.target===e.currentTarget){setLinkTarget(null);setLinkSearch('');}},
      style:{position:'fixed',inset:0,background:'rgba(15,23,42,0.45)',display:'flex',alignItems:'flex-start',justifyContent:'center',zIndex:99999,padding:'8vh 16px 16px'}},
      R('div',{onClick:e=>e.stopPropagation(),style:{background:'#fff',borderRadius:16,maxWidth:520,width:'100%',maxHeight:'78vh',display:'flex',flexDirection:'column',boxShadow:'0 25px 50px -12px rgba(0,0,0,0.25)',overflow:'hidden'}},
        R('div',{style:{padding:'14px 16px',borderBottom:'1px solid #F4F1EE'}},

        ),

/* ═══ 내 정보 · 비밀번호 변경 ═══════════════════════ */

/* ═══ 카카오톡 등에서 "보내기(공유)"로 받은 PDF 처리 ═══
   서비스워커가 공유 파일을 임시 보관 → 여기서 꺼내 자동 입력합니다. */
const SHARE_CACHE='bnf-shipping-share-v1';
const SHARE_PREFIX='/__bnf_shared__/';
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw-shipping.js').catch(()=>{});
  });
}
async function pickupSharedFiles(){
  try{
    if(!('caches' in window))return[];
    const cache=await caches.open(SHARE_CACHE);
    const cntRes=await cache.match(SHARE_PREFIX+'count');
    if(!cntRes)return[];
    const n=parseInt(await cntRes.text(),10)||0;
    const out=[];
    for(let i=0;i<n;i++){
      const res=await cache.match(SHARE_PREFIX+i);
      if(!res)continue;
      const blob=await res.blob();
      let name='공유파일'+(i+1)+'.pdf';
      try{const h=res.headers.get('x-bnf-filename');if(h)name=decodeURIComponent(h);}catch(e){}
      if(!/\.pdf$/i.test(name))name=name+'.pdf';
      out.push(new File([blob],name,{type:blob.type||'application/pdf'}));
    }
    /* 한 번 꺼내면 정리 (새로고침 시 중복 입력 방지) */
    for(const key of await cache.keys()){if(key.url.indexOf(SHARE_PREFIX)!==-1)await cache.delete(key);}
    return out;
  }catch(e){return[];}
}

/* ═══ 독립 실행형 앱: MES와 같은 DB를 사용하므로 데이터가 자동 공유됩니다 ═══ */
function ShippingApp(){
  const[mats,setMats]=useState([]);
  const[hqItems,setHqItems]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState('');
  const[shareMsg,setShareMsg]=useState('');

  const load=()=>{
    sbClient.from('app_state').select('state_data').eq('id',1).maybeSingle()
      .then(({data,error})=>{
        if(error)throw error;
        const sd=(data&&data.state_data)||{};
        setMats(Array.isArray(sd.mats)?sd.mats:[]);
        setHqItems(Array.isArray(sd.hqItems)?sd.hqItems:[]);
        setLoading(false);
      })
      .catch(e=>{setErr(e.message||'연결 실패');setLoading(false);});
  };
  useEffect(()=>{
    load();
    /* 재고 자동 연동: 1분마다 + 화면 복귀 시 최신 재고 반영 */
    const t=setInterval(load,60000);
    const onVis=()=>{if(!document.hidden)load();};
    document.addEventListener('visibilitychange',onVis);
    return()=>{clearInterval(t);document.removeEventListener('visibilitychange',onVis);};
  },[]);

  /* 공유로 들어온 PDF를 재고 로딩 후 자동 입력 */
  useEffect(()=>{
    if(loading||err)return;
    let done=false;
    const run=async()=>{
      const files=await pickupSharedFiles();
      if(done||!files.length)return;
      setShareMsg('📥 카톡에서 받은 '+files.length+'개 파일을 정리하는 중...');
      window.dispatchEvent(new CustomEvent('bnf-shared-files',{detail:files}));
      setTimeout(()=>setShareMsg(''),6000);
      /* 주소창의 ?shared=1 정리 */
      try{history.replaceState(null,'',location.pathname);}catch(e){}
    };
    run();
    return()=>{done=true;};
  },[loading,err]);

  return R('div',{className:'app'},
    R('div',{className:'hdr'},
      R('div',{style:{display:'flex',alignItems:'center',gap:9,minWidth:0}},
        R('div',{style:{width:30,height:30,borderRadius:9,background:'linear-gradient(135deg,#EE6231,#D94F1E)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}},'📦'),
        R('div',{style:{minWidth:0}},
          R('div',{style:{fontSize:14,fontWeight:800,whiteSpace:'nowrap'}},'출고 계획'),
          R('div',{style:{fontSize:9.5,color:'var(--tm)',whiteSpace:'nowrap'}},'B&F Global · 센터별 출고 정리')
        )
      ),
      R('div',{style:{flex:1}}),
      R('button',{onClick:()=>{setLoading(true);load();},title:'최신 재고 다시 불러오기',
        style:{background:'#F2EEF6',border:'1px solid #E5DEEC',borderRadius:8,padding:'6px 11px',fontSize:11,fontWeight:700,color:'#6B6B6B',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},'↻ 새로고침')
    ),
    shareMsg&&R('div',{style:{background:'#ECFDF5',borderBottom:'1px solid #A7F3D0',color:'#15803D',fontSize:12,fontWeight:700,padding:'8px 14px',flexShrink:0}},shareMsg),
    R('div',{className:'body'},
      R('div',{className:'main'},
        loading
          ? R('div',{className:'pg'},R('div',{className:'empty'},R('div',{className:'empty-ic'},'⏳'),'재고 정보를 불러오는 중...'))
          : err
            ? R('div',{className:'pg'},R('div',{className:'empty'},R('div',{className:'empty-ic'},'⚠️'),
                R('div',{style:{fontWeight:700,color:'var(--err)'}},'서버 연결 실패'),
                R('div',{style:{fontSize:11,marginTop:6}},err),
                R('button',{className:'btn bp',style:{marginTop:14},onClick:()=>{setErr('');setLoading(true);load();}},'다시 시도'))
              )
            : R(PageShipSort,{mats,hqItems})
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(R(ShippingApp));
</script>
</body>
